name: Build APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['main.dart', '.github/workflows/build.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Flutter project
        run: |
          flutter create --org com.djrat --project-name djrat_app --platforms android --no-pub .
          cp main.dart lib/main.dart
          flutter pub add supabase_flutter
      - name: Patch Android manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $M
          sed -i 's|android:label="[^"]*"|android:label="دجرات"|' $M
      - name: Build release APK
        run: flutter build apk --release
      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk djrat.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest djrat.apk --title "دجرات - أحدث نسخة" --notes "ملف التثبيت: djrat.apk"
